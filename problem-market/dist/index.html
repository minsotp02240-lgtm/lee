<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem Market — 불편함 거래소</title><style>
:root{--bg:#f5f6fa;--surface:#fff;--text:#172033;--muted:#526078;--brand:#4338ca;--brand2:#eef2ff;--green:#047857;--line:#d9dfe9;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.header-inner{max-width:1440px;margin:auto;padding:16px 28px;display:flex;align-items:center;gap:24px}.logo{font-weight:800;font-size:20px;letter-spacing:-.03em;cursor:pointer}.logo span{color:var(--brand)}.search{flex:1;max-width:520px;position:relative}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 42px 0 14px;background:#fbfcfe}.search button{position:absolute;right:6px;top:5px;width:34px;height:34px;border:0;background:transparent;color:var(--muted)}.primary{background:var(--brand);color:white;border:0;border-radius:8px;height:44px;padding:0 18px;font-weight:700}.primary:hover{background:#3730a3}.ghost{background:white;border:1px solid var(--line);color:var(--text);border-radius:8px;height:44px;padding:0 16px;font-weight:600}.shell{max-width:1440px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#fff 0%,#f7f7ff 100%);border:1px solid var(--line);border-radius:14px;padding:28px 32px;margin-bottom:24px}.hero h1{font-size:28px;margin:0 0 8px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:16px}.notice{margin-top:16px;color:#4c51a3;background:var(--brand2);display:inline-flex;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 250px;gap:24px}.sidebar,.insight{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;height:max-content}.sidebar h3,.insight h3{font-size:14px;margin:0 0 12px}.cat{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;color:var(--muted);margin:3px 0}.cat.active{background:var(--brand2);color:var(--brand);font-weight:700}.feed-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.feed-head h2{font-size:20px;margin:0}.sort{border:1px solid var(--line);height:40px;border-radius:8px;background:#fff;padding:0 12px;color:var(--text)}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:12px;transition:.15s}.card:hover{border-color:#9da3bd;transform:translateY(-1px)}.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.chip{background:var(--brand2);color:var(--brand);border-radius:999px;padding:4px 9px;font-weight:700}.card h3{font-size:18px;margin:12px 0 6px}.card p{color:var(--muted);margin:0 0 16px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.stats{display:flex;gap:16px;color:var(--muted);font-size:13px;flex-wrap:wrap}.stats b{color:var(--text)}.stat-green{color:var(--green)!important}.detail-link{float:right;color:var(--brand);font-weight:700;font-size:14px}.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;text-align:center;padding:48px 20px;color:var(--muted)}.insight p{font-size:13px;line-height:1.7;color:var(--muted)}.bar{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}.page{max-width:760px;margin:auto}.back{border:0;background:transparent;color:var(--muted);padding:0;margin-bottom:18px}.form-card,.detail-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}.form-card h1,.detail-card h1{font-size:26px;margin:0 0 24px}.field{margin-bottom:20px}.field label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.count{font-size:12px;color:var(--muted);font-weight:400}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;color:var(--text)}.field textarea{min-height:180px;resize:vertical}.error{color:var(--danger);font-size:13px;margin-top:6px}.form-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:8px}.hint{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px}.detail-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.detail-card h1{margin:14px 0 12px}.body{white-space:pre-wrap;line-height:1.8;color:#33405a}.like{margin:24px 0;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 16px;font-weight:700}.like.on{background:#fff1f2;border-color:#fecdd3;color:#be123c}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.panel{border:1px solid var(--line);border-radius:12px;padding:20px}.panel h3{margin:0 0 14px}.radio{display:flex;gap:10px;padding:10px 0;color:var(--muted)}.radio input{accent-color:var(--brand)}.metric{display:flex;justify-content:space-between;margin:10px 0}.metric strong{font-size:22px}.distribution{margin-top:18px}.dist-row{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin:12px 0}.subtle{font-size:12px;color:var(--muted);line-height:1.6}.success{padding:12px 14px;background:#ecfdf5;color:#047857;border-radius:8px;margin-bottom:16px;font-weight:600}
@media(max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr)}.insight{grid-column:1/-1}}@media(max-width:767px){.header-inner{padding:12px 16px;gap:12px;flex-wrap:wrap}.logo{font-size:18px}.search{order:3;flex-basis:100%;max-width:none}.shell{padding:16px}.hero{padding:22px}.hero h1{font-size:24px}.layout{display:block}.sidebar{display:flex;overflow:auto;margin-bottom:16px;padding:8px}.sidebar h3{display:none}.cat{white-space:nowrap;width:auto}.insight{margin-top:16px}.feed-head{align-items:flex-start;gap:10px}.feed-head h2{font-size:18px}.form-card,.detail-card{padding:20px}.analysis{grid-template-columns:1fr}.form-foot{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.detail-top{flex-direction:column;gap:10px}}
</style></head><body><div id="app"></div><script>
const CATS=['전체','생활·자취','교육','업무·생산성','소비·쇼핑','기술·AI','기타'];const PRICES=['0원','1~3천 원','3천 원 초과~1만 원','1만 원 초과~3만 원','3만 원 초과'];
const seed=[{id:'s1',title:'1인분 배달음식은 선택지가 너무 적어요',category:'생활·자취',body:'혼자 사는 날 배달을 시키면 2인분부터 주문해야 하거나 최소 주문 금액을 맞추느라 불필요한 음식을 사게 됩니다. 남은 음식은 버리게 되어 아깝습니다.',createdAt:'2026-11-24',isExample:true,likes:128,dist:[18,14,12,4,2]},{id:'s2',title:'팀플 자료가 여러 앱에 흩어져 찾기 어려워요',category:'교육',body:'팀 프로젝트를 하다 보면 파일은 드라이브에, 일정은 메신저에, 결정 사항은 또 다른 문서에 남습니다. 새로 합류한 팀원이 맥락을 파악하기 어렵습니다.',createdAt:'2026-11-22',isExample:true,likes:94,dist:[11,16,9,3,1]},{id:'s3',title:'회의 전에 지난 논의 내용을 빠르게 훑고 싶어요',category:'업무·생산성',body:'회의가 많아질수록 이전 회의에서 결정한 내용과 다음 액션을 찾는 데 시간이 걸립니다. 회의록을 요약해 보여주는 기능이 있으면 좋겠습니다.',createdAt:'2026-11-19',isExample:true,likes:71,dist:[8,10,7,2,1]}];
let posts=JSON.parse(localStorage.getItem('pm_posts')||'null')||seed;let state={view:'home',cat:'전체',q:'',sort:'latest',id:null};
const save=()=>localStorage.setItem('pm_posts',JSON.stringify(posts));const userKey=id=>'pm_like_'+id;const respKey=id=>'pm_resp_'+id;const dateFmt=d=>new Date(d).toLocaleDateString('ko-KR',{month:'short',day:'numeric'});const responses=p=>{let d=p.dist||[0,0,0,0,0];let r=localStorage.getItem(respKey(p.id));if(r!==null)d=d.map((n,i)=>n+(+r===i?1:0));return d};const total=p=>responses(p).reduce((a,b)=>a+b,0);const pct=p=>{let t=total(p),d=responses(p);return t?Math.round((t-d[0])/t*100):null};
function render(){document.getElementById('app').innerHTML=state.view==='home'?home():state.view==='new'?newPage():detail();}
function header(){return `<header class="header"><div class="header-inner"><div class="logo" onclick="goHome()">Problem <span>Market</span></div><div class="search"><input aria-label="문제 검색" placeholder="문제 검색..." value="${esc(state.q)}" oninput="state.q=this.value;render()"><button aria-label="검색">⌕</button></div><button class="primary" onclick="state.view='new';render()">＋ 불편함 등록</button></div></header>`}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function home(){let list=posts.filter(p=>(state.cat==='전체'||p.category===state.cat)&&(`${p.title} ${p.body}`.toLowerCase().includes(state.q.toLowerCase())));list.sort((a,b)=>state.sort==='likes'?b.likes-a.likes:state.sort==='willing'?(pct(b)??-1)-(pct(a)??-1)||total(b)-total(a):new Date(b.createdAt)-new Date(a.createdAt));return header()+`<main class="shell"><section class="hero"><h1>누군가의 불편함은<br>누군가의 사업 기회다.</h1><p>일상 속 문제를 발견하고, 공감과 지불 의향으로 잠재적 수요를 확인하세요.</p><span class="notice">프로토타입 · 가상 예시 데이터 포함</span></section><div class="layout"><aside class="sidebar"><h3>카테고리</h3>${CATS.map(c=>`<button class="cat ${state.cat===c?'active':''}" onclick="state.cat='${c}';render()">${c}</button>`).join('')}</aside><section><div class="feed-head"><h2>문제 탐색 <span style="color:var(--muted);font-size:13px;font-weight:400">${list.length}개</span></h2><select class="sort" onchange="state.sort=this.value;render()"><option value="latest" ${state.sort==='latest'?'selected':''}>최신순</option><option value="likes" ${state.sort==='likes'?'selected':''}>공감순</option><option value="willing" ${state.sort==='willing'?'selected':''}>지불 의향순</option></select></div>${list.length?list.map(card).join(''):`<div class="empty">조건에 맞는 문제가 없습니다.<br><button class="ghost" style="margin-top:14px" onclick="state={view:'home',cat:'전체',q:'',sort:'latest'};render()">필터 초기화</button></div>`}</section><aside class="insight"><h3>지표 안내</h3><p>지불 의향은 해결 서비스에 대한 월간 지불 의사를 묻는 조사입니다.</p><p>표시된 수치는 실제 결제나 구매 약속이 아니며, 예시 데이터는 가상으로 생성되었습니다.</p><div style="margin-top:18px"><div class="subtle">이용 안내</div><p>로그인 없이 브라우저에 저장되며, 다른 사용자와 공유되지 않습니다.</p></div></aside></div></main>`}
function card(p){let pr=pct(p),r=total(p);return `<article class="card" tabindex="0" onclick="openDetail('${p.id}')"><div class="meta"><span class="chip">${p.category}</span>${p.isExample?'<span>예시 데이터</span>':''}<span>· ${dateFmt(p.createdAt)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="stats"><span>♡ <b>${p.likes+(localStorage.getItem(userKey(p.id))?'1':'')}</b> 공감</span><span class="stat-green">지불 의향 <b>${pr===null?'응답 없음':pr+'%'}</b></span><span>응답 <b>${r}명</b></span></div><span class="detail-link">상세보기</span></article>`}
function newPage(){return header()+`<main class="shell page"><button class="back" onclick="goHome()">← 돌아가기</button><div class="form-card"><h1>불편함 등록</h1><div id="form-msg"></div><form onsubmit="submitPost(event)"><div class="field"><label for="title">제목 <span class="count" id="title-count">0/80</span></label><input id="title" maxlength="80" minlength="5" placeholder="어떤 점이 불편한가요?" oninput="document.getElementById('title-count').textContent=this.value.length+'/80'"><div id="title-err"></div></div><div class="field"><label for="category">카테고리</label><select id="category"><option value="">카테고리를 선택하세요</option>${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><div id="category-err"></div></div><div class="field"><label for="body">구체적인 상황 및 불편함 <span class="count" id="body-count">0/1000</span></label><textarea id="body" maxlength="1000" placeholder="언제, 어떤 상황에서 불편함을 겪었고 기존 해결 방법은 왜 부족했나요?" oninput="document.getElementById('body-count').textContent=this.value.length+'/1000'"></textarea><div id="body-err"></div></div><div class="form-foot"><div class="hint">개인정보, 연락처, 계좌번호 등은 입력하지 마세요.<br>등록한 내용은 이 브라우저에만 저장됩니다.</div><div class="actions"><button type="button" class="ghost" onclick="goHome()">취소</button><button class="primary">등록하기</button></div></div></form></div></main>`}
function submitPost(e){e.preventDefault();let t=document.getElementById('title'),c=document.getElementById('category'),b=document.getElementById('body'),ok=true;[['title-err',t.value.trim().length<5||t.value.trim().length>80,'제목을 5~80자로 입력해 주세요.'],['category-err',!c.value,'카테고리를 선택해 주세요.'],['body-err',b.value.trim().length<20||b.value.trim().length>1000,'내용을 20~1000자로 입력해 주세요.']].forEach(([id,err,msg])=>{document.getElementById(id).innerHTML=err?`<div class="error">${msg}</div>`:'';if(err)ok=false});if(!ok)return;posts.unshift({id:'p'+Date.now(),title:t.value.trim(),category:c.value,body:b.value.trim(),createdAt:new Date().toISOString(),isExample:false,likes:0,dist:[0,0,0,0,0]});save();state={view:'home',cat:'전체',q:'',sort:'latest'};render()}
function openDetail(id){state={view:'detail',id};render()}function detail(){let p=posts.find(x=>x.id===state.id);if(!p){state.view='home';return home()}let r=responses(p),t=r.reduce((a,b)=>a+b,0),pr=pct(p),liked=!!localStorage.getItem(userKey(p.id)),resp=localStorage.getItem(respKey(p.id));return header()+`<main class="shell page"><button class="back" onclick="goHome()">← 홈 피드</button><div class="detail-card"><div class="detail-top"><div class="meta"><span class="chip">${p.category}</span>${p.isExample?'<span>예시 데이터</span>':''}<span>· ${dateFmt(p.createdAt)}</span></div></div><h1>${esc(p.title)}</h1><div class="body">${esc(p.body)}</div><button class="like ${liked?'on':''}" onclick="toggleLike('${p.id}')">${liked?'♥ 공감 취소':'♡ 공감하기'} ${p.likes+(liked?'1':'')}</button><div class="analysis"><section class="panel"><h3>월 지불 의향 조사</h3><p class="subtle">이 문제가 해결된다면 매월 얼마를 지불할 의향이 있나요?</p>${PRICES.map((x,i)=>`<label class="radio"><input type="radio" name="price" value="${i}" ${+resp===i?'checked':''}>${x}</label>`).join('')}<div id="resp-msg"></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="saveResp('${p.id}')">응답 저장</button>${resp!==null?`<button class="ghost" onclick="clearResp('${p.id}')">응답 취소</button>`:''}</div></section><section class="panel"><h3>수요 분석</h3><div class="metric"><span>전체 공감</span><strong>${p.likes+(liked?'1':'')}</strong></div><div class="metric"><span>지불 의향 응답</span><strong>${t}명</strong></div><div class="metric"><span>0원 초과 의향</span><strong class="stat-green">${pr===null?'응답 없음':pr+'%'}</strong></div><div class="distribution">${t?r.map((n,i)=>`<div class="dist-row"><span>${PRICES[i]}</span><div class="bar"><i style="width:${Math.round(n/Math.max(...r)*100)}%"></i></div><b>${n}명</b></div>`).join(''):`<div class="empty" style="padding:18px">응답 없음</div>`}</div><p class="subtle">지불 의향은 실제 구매나 결제를 보장하지 않습니다.</p></section></div></div></main>`}
function toggleLike(id){let k=userKey(id);localStorage.getItem(k)?localStorage.removeItem(k):localStorage.setItem(k,'1');render()}function saveResp(id){let sel=document.querySelector('input[name=price]:checked');if(!sel){document.getElementById('resp-msg').innerHTML='<div class="error">지불 의향을 선택해 주세요.</div>';return}localStorage.setItem(respKey(id),sel.value);render()}function clearResp(id){localStorage.removeItem(respKey(id));render()}function goHome(){state={view:'home',cat:'전체',q:'',sort:'latest'};render()}render();
</script></body></html>
